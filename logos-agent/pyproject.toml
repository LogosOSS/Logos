[project]
name = "logos-agent"
version = "0.1.0"
description = "Runs coding agents in isolated containers on capacity Logos is not otherwise using"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi[standard]==0.162.2",
    # Pinned explicitly: starlette arrives transitively through fastapi.
    "starlette==1.10.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "sqlalchemy[asyncio]==2.1.8",
    "asyncpg==0.32.0",
    "pydantic==2.14.3",
    "pyjwt[crypto]==2.15.1",
    # Security floors for transitive packages (fastapi[standard] / httpx).
    "certifi==2026.10.23",
    "dnspython==2.9.2",
    # The exporter requires the matching opentelemetry-sdk release, which in
    # turn pins opentelemetry-api exactly. Declaring only the exporter keeps
    # the trio on one release line and lets a single version bump move all
    # three; separate pins cannot be bumped one at a time.
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    # Coverage of the test run, imported by the SonarQube Cloud analysis.
    "coverage[toml]==7.17.2",
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 120
