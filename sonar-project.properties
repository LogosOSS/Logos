sonar.projectKey=LogosOSS_Logos
sonar.organization=logos
sonar.projectName=Logos

# One project covers the whole monorepo. Every file is either main code or
# test code: the test patterns appear in both sonar.exclusions and
# sonar.test.inclusions so that no file is indexed twice.
sonar.sources=.
sonar.tests=.

# Main code excludes generated output, dependencies, vendored files, binary
# media and the test patterns below.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/target/**,**/.angular/**,docs/static/**,docs/vendor/**,\
  **/coverage.xml,**/coverage/**,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.wav,**/*.mp4,**/*.woff,**/*.woff2,\
  **/tests/**,logos-webservice/src/test/**,**/*.spec.ts,logos-ui/e2e/**,e2e/**,benchmarks/**,logos-workernode/tools/**

# Tests, benchmarks and measurement scripts are analysed as test code, so they
# do not count towards the security and reliability ratings of the product.
sonar.test.inclusions=**/tests/**,logos-webservice/src/test/**,**/*.spec.ts,logos-ui/e2e/**,e2e/**,benchmarks/**,logos-workernode/tools/**
sonar.test.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/target/**,\
  **/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.webp,**/*.wav,**/*.mp4,**/*.woff,**/*.woff2

sonar.python.version=3.13
sonar.python.coverage.reportPaths=logos-orchestrator/coverage.xml,logos-workernode/coverage.xml,logos-node-manager/coverage.xml,logos-agent/coverage.xml

sonar.java.source=25
sonar.java.binaries=logos-webservice/target/classes
sonar.java.test.binaries=logos-webservice/target/test-classes
sonar.java.libraries=logos-webservice/target/dependency/*.jar
sonar.java.test.libraries=logos-webservice/target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=logos-webservice/target/site/jacoco/jacoco.xml

sonar.javascript.lcov.reportPaths=logos-ui/coverage/logos-ui/lcov.info

# Duplication is measured on main code only: tests repeat fixtures and
# arrange blocks on purpose.
sonar.cpd.exclusions=**/tests/**,logos-webservice/src/test/**,**/*.spec.ts,logos-ui/e2e/**,e2e/**,benchmarks/**,logos-workernode/tools/**

# Rules that do not apply to this repository. Each entry names the reason.
sonar.issue.ignore.multicriteria=rootUser,copyPerm,pipBuild,pipLock,npmScripts,allSecrets,testCleanup

# Images run as their base image user: the gateways bind port 80, the node
# manager and agent runner drive the Docker socket, and the deployments mount
# volumes owned by root.
sonar.issue.ignore.multicriteria.rootUser.ruleKey=docker:S6471
sonar.issue.ignore.multicriteria.rootUser.resourceKey=**/Dockerfile*
sonar.issue.ignore.multicriteria.copyPerm.ruleKey=docker:S6504
sonar.issue.ignore.multicriteria.copyPerm.resourceKey=**/Dockerfile*

# Python packages install from the pinned versions in pyproject.toml and the
# uv lock files; the local projects themselves must be built from source.
sonar.issue.ignore.multicriteria.pipBuild.ruleKey=*:S8541
sonar.issue.ignore.multicriteria.pipBuild.resourceKey=**/*
sonar.issue.ignore.multicriteria.pipLock.ruleKey=*:S8544
sonar.issue.ignore.multicriteria.pipLock.resourceKey=**/*

# npm installs run from the committed lock files with exact versions; the
# Angular and Docusaurus toolchains need their install scripts.
sonar.issue.ignore.multicriteria.npmScripts.ruleKey=*:S6505
sonar.issue.ignore.multicriteria.npmScripts.resourceKey=**/*

# The deploy workflows write every repository secret of the environment into
# the .env file of the target host.
sonar.issue.ignore.multicriteria.allSecrets.ruleKey=githubactions:S7634
sonar.issue.ignore.multicriteria.allSecrets.resourceKey=.github/workflows/logos_deploy-*.yml

# Test fixtures empty whole tables between test cases.
sonar.issue.ignore.multicriteria.testCleanup.ruleKey=plsql:DeleteOrUpdateWithoutWhereCheck
sonar.issue.ignore.multicriteria.testCleanup.resourceKey=logos-webservice/src/test/resources/**
