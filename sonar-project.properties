sonar.projectKey=LogosOSS_Logos
sonar.organization=logos
sonar.projectName=Logos

# One project covers the whole monorepo. Every file is either main code or
# test code: the test patterns appear in both sonar.exclusions and
# sonar.test.inclusions so that no file is indexed twice.
sonar.sources=.
sonar.tests=.

# Main code excludes generated output, dependencies, vendored files and the
# test patterns below.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/target/**,**/.angular/**,docs/static/**,docs/vendor/**,\
  **/tests/**,logos-webservice/src/test/**,**/*.spec.ts,logos-ui/e2e/**,e2e/**,benchmarks/**,logos-workernode/tools/**

# Tests, benchmarks and measurement scripts are analysed as test code, so they
# do not count towards the security and reliability ratings of the product.
sonar.test.inclusions=**/tests/**,logos-webservice/src/test/**,**/*.spec.ts,logos-ui/e2e/**,e2e/**,benchmarks/**,logos-workernode/tools/**
sonar.test.exclusions=**/node_modules/**,**/.venv/**,**/__pycache__/**,**/dist/**,**/build/**,**/target/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=logos-orchestrator/coverage.xml

sonar.java.source=25
sonar.java.binaries=logos-webservice/target/classes
