<text x="830.0" y="102.0" text-anchor="middle" font-size="20" font-weight="700" fill="#241c3b">traefik</text>
<text x="830.0" y="124.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5f5688">routes by path, balances</text>
<rect x="1020" y="60" width="380" height="90" rx="18" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
