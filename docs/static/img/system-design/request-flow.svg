<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 948" width="1460" height="948" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Activity diagram of an inference request">
<title>Logos inference request flow (UML activity diagram)</title>
<rect width="1460" height="948" fill="#fff"/>
