<text x="1210.0" y="504.0" text-anchor="middle" font-size="18" font-weight="400" fill="#5f5688">classifies, schedules</text>
<path d="M 1210 530 V 590" fill="none" stroke="#241c3b" stroke-width="2" marker-end="url(#open)"/>
