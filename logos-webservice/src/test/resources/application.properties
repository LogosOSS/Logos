# Datasource URL/driver/user/password come from Testcontainers
# (@ServiceConnection / @DynamicPropertySource) — every @SpringBootTest
# overrides them onto postgres:17. Do not put an in-memory H2 fallback here.
spring.jpa.hibernate.ddl-auto=none
spring.liquibase.enabled=false
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8085/realms/tum
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/realms/tum/protocol/openid-connect/certs
logos.auth.client-id=logos
# Tests reseed the same teams between methods, so the period aggregates of the
# team activity view must not survive across tests.
logos.team-activity.aggregate-cache-ttl-seconds=0
# No Redis in tests: push notifications to this instance's sockets directly.
logos.notifications.fanout=local
