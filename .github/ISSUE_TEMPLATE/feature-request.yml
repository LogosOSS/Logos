name: "🚀 Feature Request"
description: Suggest an improvement to Logos.
type: feature
labels: [feature]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like to improve?
      description: Briefly describe the problem and the outcome you would like.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples, sketches, success criteria, or alternatives if helpful.
