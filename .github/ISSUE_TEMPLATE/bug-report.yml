name: "🐛 Bug Report"
description: Report something that is not working as expected.
type: bug
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Briefly describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it? (optional)
      description: Add steps or a small example, if you know how to trigger the problem.
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Version, affected component, environment, logs, or screenshots — whatever helps. Remove secrets from logs.
