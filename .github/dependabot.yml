version: 2

# Maintain the actions, benchmark tools and pre-commit hooks used by CI together.
multi-ecosystem-groups:
  ci-tooling:
    schedule:
      interval: "weekly"

updates:
  # The logos services are uv projects. The ecosystem is "uv" rather than "pip"
  # deliberately: these images install with `uv sync --locked`, so a bump that
  # edited pyproject.toml without updating uv.lock would fail the build.
  #
  # Dependabot bumps one requirement at a time and re-locks after each, so
  # packages that pin each other exactly must not both be declared in
  # pyproject.toml: declare the top-most one and let uv.lock carry the rest.
  - package-ecosystem: "uv"
    directories:
      - "/logos-agent"
      - "/logos-node-manager"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      agent-and-node-manager:
        patterns: ["*"]
      service-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "logos-orchestrator"
    schedule:
      interval: "weekly"
    ignore:
      # SQLAlchemy 2.1 changes the default driver for `postgresql://` URLs; the
      # pin in pyproject.toml explains what moving off 2.0 requires.
      - dependency-name: "sqlalchemy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      logos-orchestrator-python-dependencies:
        patterns: ["*"]
      orchestrator-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories:
      - "logos-ui"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    # Angular 22 requires typescript >=6.0 <6.1. TS 7.0 has no stable
    # programmatic compiler API yet; Angular support is blocked until ~7.1+.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-dependencies:
        patterns: ["*"]
      ui-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    # The second entry is for the actions that the workflows share: they pin the actions that they use as well.
    directories:
      - "/"
      - "/.github/actions/*"
    patterns: ["*"]
    multi-ecosystem-group: ci-tooling

  - package-ecosystem: "pip"
    directories:
      - "/tools/pre-commit"
      - "/benchmarks"
      - "/benchmarks/gateway_concurrency"
    patterns: ["*"]
    multi-ecosystem-group: ci-tooling

  - package-ecosystem: "maven"
    directory: "/logos-webservice"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      webservice-maven:
        patterns: ["*"]
      maven-security:
        applies-to: security-updates
        patterns: ["*"]

  # The documentation build has its own lockfile and TypeScript constraints.
  - package-ecosystem: "npm"
    directory: "/docs"
    versioning-strategy: increase
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      docs-npm:
        patterns: ["*"]
      docs-security:
        applies-to: security-updates
        patterns: ["*"]

  # CI regenerates the platform-specific hash locks from these inputs.
  - package-ecosystem: "pip"
    directories:
      - "/logos-workernode"
      - "/e2e"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      # The worker image also resolves vLLM's FastAPI constraint.
      fastapi:
        patterns: ["fastapi"]
      python-requirements:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/agent-gateway"
      - "/db"
      - "/e2e/harness/nodesim"
      - "/logos-agent"
      - "/logos-agent/workspace"
      - "/logos-node-manager"
      - "/logos-node-manager/tests/smoke/dummy-worker"
      - "/logos-orchestrator"
      - "/logos-ui"
      - "/logos-webservice"
      - "/logos-workernode"
      - "/rate-limit-gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # The current Python image line has matching native wheels and lockfiles.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      # Each database engine or migration tool has its own major-upgrade decision.
      base-images-migrations:
        patterns: ["postgres", "redis", "liquibase/liquibase"]
        group-by: dependency-name
        update-types: ["major"]
      base-images:
        patterns: ["*"]
      base-image-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/benchmarks/gateway_concurrency"
      - "/e2e/harness/stack"
      - "/logos-node-manager"
      - "/logos-node-manager/tests/smoke"
      - "/logos-workernode"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "ghcr.io/logososs/*"
    groups:
      # Each database engine or migration tool has its own major-upgrade decision.
      compose-images-migrations:
        patterns: ["postgres", "redis", "liquibase/liquibase"]
        group-by: dependency-name
        update-types: ["major"]
      compose-images:
        patterns: ["*"]
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
