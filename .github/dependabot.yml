version: 2

# One scheduled PR covers ordinary version updates across package managers.
# Custom Python hash locks and base images stay separate: updating their pins
# alone can break resolution against vLLM or the fixed distro snapshots.
# Security updates are independent of the weekly schedule.
multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: "weekly"

updates:
  # The logos services are uv projects. The ecosystem is "uv" rather than "pip"
  # deliberately: these images install with `uv sync --locked`, so a bump that
  # edited pyproject.toml without updating uv.lock would fail the build.
  #
  # Dependabot bumps one requirement at a time and re-locks after each, so
  # packages that pin each other exactly must not both be declared in
  # pyproject.toml: declare the top-most one and let uv.lock carry the rest.
  - package-ecosystem: "uv"
    directories:
      - "/logos-agent"
      - "/logos-node-manager"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      service-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "uv"
    directory: "/logos-orchestrator"
    ignore:
      # SQLAlchemy 2.1 changes the default driver for `postgresql://` URLs; the
      # pin in pyproject.toml explains what moving off 2.0 requires.
      - dependency-name: "sqlalchemy"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      orchestrator-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/logos-ui"
    versioning-strategy: increase
    # Angular 22 requires typescript >=6.0 <6.1. TS 7.0 has no stable
    # programmatic compiler API yet; Angular support is blocked until ~7.1+.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      ui-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/logos-agent/workspace"
    versioning-strategy: "increase"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      workspace-npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    # The second entry is for the actions that the workflows share: they pin the actions that they use as well.
    directories:
      - "/"
      - "/.github/actions/*"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies

  - package-ecosystem: "maven"
    directory: "/logos-webservice"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      maven-security:
        applies-to: security-updates
        patterns: ["*"]

  # The documentation build has its own lockfile and TypeScript constraints.
  - package-ecosystem: "npm"
    directory: "/docs"
    versioning-strategy: increase
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    groups:
      docs-security:
        applies-to: security-updates
        patterns: ["*"]

  # These inputs share custom hash locks. The test workflow exports a lock
  # patch when they change; commit it with the dependency versions before merging.
  - package-ecosystem: "pip"
    directories:
      - "/logos-workernode"
      - "/e2e"
      - "/tools/pre-commit"
      - "/benchmarks"
      - "/benchmarks/gateway_concurrency"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 1
    ignore:
      # The worker's pinned vLLM currently requires FastAPI <0.137. Update this
      # compatibility guard when moving to a newer vLLM/FastAPI release line.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      python-hash-lock-inputs:
        patterns: ["*"]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories:
      - "/agent-gateway"
      - "/db"
      - "/e2e/harness/nodesim"
      - "/logos-agent"
      - "/logos-agent/workspace"
      - "/logos-node-manager"
      - "/logos-node-manager/tests/smoke/dummy-worker"
      - "/logos-orchestrator"
      - "/logos-ui"
      - "/logos-webservice"
      - "/logos-workernode"
      - "/rate-limit-gateway"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # The current Python image line has matching native wheels and lockfiles.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # PostgreSQL major upgrades need a coordinated change to the data layout,
      # pg_cron and the deployment path, not a one-line base image update.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
    groups:
      # Each datastore or migration tool has its own major-upgrade decision.
      base-images-migrations:
        patterns: ["redis", "valkey/valkey", "liquibase/liquibase"]
        group-by: dependency-name
        update-types: ["major"]
      base-images:
        patterns: ["*"]
      base-image-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: "docker-compose"
    directories:
      - "/"
      - "/benchmarks/gateway_concurrency"
      - "/e2e/harness/stack"
      - "/logos-node-manager"
      - "/logos-node-manager/tests/smoke"
      - "/logos-workernode"
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    ignore:
      - dependency-name: "ghcr.io/logososs/*"
      # PostgreSQL major upgrades need a coordinated change to the data layout,
      # pg_cron and the deployment path, not a one-line base image update.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # Major datastore and migration-tool upgrades should not enter this bundle.
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
      - dependency-name: "valkey/valkey"
        update-types: ["version-update:semver-major"]
      - dependency-name: "liquibase/liquibase"
        update-types: ["version-update:semver-major"]
    groups:
      compose-security:
        applies-to: security-updates
        patterns: ["*"]
