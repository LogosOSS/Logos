---
name: Logos - Lint

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_lint.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Install pre-commit and the hook tools
        # Every hook is `language: system`, so this locked set is all the
        # hooks run; pre-commit builds no hook environments of its own.
        run: |
          pip install --no-deps --require-hashes -r tools/pre-commit/requirements.lock
          pip check

      - name: Test registry deployment configuration
        run: |
          python3 .github/scripts/tests/test_registry_workflows.py

      - name: Run pre-commit on logos
        # Top-level `files: '^logos/'` in .pre-commit-config.yaml
        # scopes every hook to the logos tree, so --all-files is safe.
        # The job fails when any hook reports changes or violations
        # (black, isort, autoflake, flake8, plus the basic hygiene checks).
        run: |
          pre-commit run \
            --config .pre-commit-config.yaml \
            --all-files \
            --show-diff-on-failure \
            --color always
