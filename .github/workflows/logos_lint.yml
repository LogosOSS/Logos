---
name: Logos - Lint

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_lint.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache pre-commit envs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-logos-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-logos-${{ runner.os }}-

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: Run pre-commit on logos
        # Top-level `files: '^logos/'` in .pre-commit-config.yaml
        # scopes every hook to the logos tree, so --all-files is safe.
        # The job fails when any hook reports changes or violations
        # (black, isort, autoflake, flake8, plus the basic hygiene checks).
        run: |
          pre-commit run \
            --config .pre-commit-config.yaml \
            --all-files \
            --show-diff-on-failure \
            --color always
