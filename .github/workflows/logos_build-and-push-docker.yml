# Logos – CI – Image builds
#
# Every image is published twice:
#   - the project's Harbor registry, which the deploy workflows pull from;
#   - ghcr.io/logososs/<image>, public, which is what a
#     self-hosted install pulls (docker-compose.yaml defaults to it, so
#     the installation guide needs no registry configuration at all).
#
# The GHCR mirror is fed by pushes to main only, so it carries exactly one
# moving tag, `latest`. A pull request builds to Harbor alone, where the
# cleanup workflow prunes its pr-<number> tag when the PR closes — nothing
# prunes a public package, so PR builds must not land there. Release events
# stay on Harbor too: the public mirror tracks main, and a version tag is
# published to the deployment registry.
#
# Dependabot pull requests build every image but push none of them: its runs
# see no Harbor credentials, and its GITHUB_TOKEN is read-only, so GHCR would
# refuse the push as well. The build still catches a dependency bump that
# breaks an image.
#
# The MLX worker is the exception on both counts: it is a distribution
# artifact for Macs, never deployed, so GHCR is its only registry and it
# keeps its own pr-<number> and version tags there.
#
# The node manager is the exception in the other direction: it is published to
# Harbor only. Only the project's own worker hosts run it, and a new GHCR
# package starts private, so the mirror is left out until a self-hosted install
# has a reason to run the node manager.
#
# NOTE: check the visibility of a package the first time it appears — a new
# image, or one whose package was deleted. A package that comes out private
# serves a 403 to the self-hosted installs the guide tells to pull without a
# login; Package settings → Change visibility → Public fixes it.

name: Logos - Build

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/logos_build-and-push-docker.yml"
      - "!README.md"
  push:
    branches:
      - main
    paths:
      - "**"
      - ".github/workflows/logos_build-and-push-docker.yml"
      - "!README.md"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-workernode-build:
    name: Check whether the vLLM worker must be built
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # A pull request keeps the same pr-<number> image tag for its lifetime.
      # Use the commit of the last successful worker job as the baseline. This
      # still reuses a worker that succeeded in an otherwise failed workflow,
      # while a failed worker build is retried on the next run.
      - name: Find previous successful worker build
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}
        id: previous-build
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "logos_build-and-push-docker.yml",
              branch: context.payload.pull_request.head.ref,
              event: "pull_request",
              per_page: 30,
            });

            const previousRuns = response.data.workflow_runs.filter(run =>
              run.id !== context.runId &&
              run.pull_requests?.some(pull => pull.number === pullNumber)
            );

            for (const run of previousRuns) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                { owner, repo, run_id: run.id, filter: "latest", per_page: 100 },
              );
              const successfulWorker = jobs.some(job =>
                job.name.startsWith("Build Logos Worker Node (vLLM) / build (") &&
                job.conclusion === "success"
              );

              if (successfulWorker) {
                core.setOutput("head-sha", run.head_sha);
                return;
              }
            }

            core.setOutput("head-sha", "");

      - name: Decide whether to build the vLLM worker
        id: decision
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          CURRENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIOUS_SUCCESSFUL_SHA: ${{ steps.previous-build.outputs.head-sha }}
        run: |
          set -euo pipefail

          # Main and release images must always be refreshed. A newly opened or
          # reopened PR must also build once because its pr-<number> tag may not
          # exist (the close workflow removes it from Harbor).
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$EVENT_ACTION" != "synchronize" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building worker: initial PR, reopened PR, main push, or release."
            exit 0
          fi

          # No successful worker job means there is no trustworthy PR image to reuse.
          if [ -z "$PREVIOUS_SUCCESSFUL_SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building worker: no previous successful worker build was found."
            exit 0
          fi

          if ! git cat-file -e "${PREVIOUS_SUCCESSFUL_SHA}^{commit}" 2>/dev/null; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building worker: previous worker commit is unavailable locally."
            exit 0
          fi

          # Compare only inputs that can change the worker image. Documentation,
          # tests, research results, Compose files, and host configuration are
          # excluded because Dockerfile/.dockerignore keep them out of the image.
          if git diff --quiet "$PREVIOUS_SUCCESSFUL_SHA" "$CURRENT_SHA" -- \
            logos-workernode/Dockerfile \
            logos-workernode/.dockerignore \
            logos-workernode/requirements.txt \
            logos-workernode/logos_worker_node \
            logos-workernode/tools \
            ':(exclude,glob)logos-workernode/tools/**/*.md' \
            .github/workflows/logos_build-and-push-docker.yml; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Skipping worker: build inputs are unchanged since $PREVIOUS_SUCCESSFUL_SHA."
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building worker: build inputs changed since $PREVIOUS_SUCCESSFUL_SHA."
          fi

  build-server:
    name: Build Logos Server
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: .
      file: logos-orchestrator/Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      # GHA build cache. Without this the reusable workflow defaults to
      # cache=false, so every build re-runs every layer on a fresh runner
      # (apt toolchain, uv venv, full dependency install) even when only
      # source files changed.
      #
      # The GHA cache isolates entries by branch: builds on main populate
      # the cache, PR builds read it, but PR branches never share caches
      # with each other and never write into main's — the first build
      # after a merge is the one that refreshes it. The fixed scope keeps
      # all of a branch's builds on the same key.
      #
      # cache-mode: max — the expensive layers (apt toolchain, uv venv,
      # full dependency install) live in the non-final `builder` stage;
      # the default min mode only exports the resulting image's layers
      # and would leave the builder stage cold on every fresh runner.
      cache: true
      cache-scope: logos-orchestrator
      cache-mode: max
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-orchestrator' || format('{0}/logos/logos-orchestrator', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-orchestrator' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-webservice:
    name: Build Logos Webservice
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: ./logos-webservice
      file: Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      # Same cold-runner problem: the expensive mvn build runs in the
      # non-final `builder` stage, so max mode is needed to export those
      # layers (default min would only cache the final JRE stage).
      cache: true
      cache-scope: logos-webservice
      cache-mode: max
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-webservice' || format('{0}/logos/logos-webservice', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-webservice' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-ui:
    name: Build Logos UI
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: ./logos-ui
      file: Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      # Same cold-runner problem: `npm ci` and `ng build` run in the
      # non-final `build` stage, so max mode is needed to export those
      # layers (default min would only cache the final nginx stage).
      cache: true
      cache-scope: logos-ui
      cache-mode: max
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-ui' || format('{0}/logos/logos-ui', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-ui' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-db:
    name: Build Logos DB
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: ./db
      file: Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      # min mode (the default) is sufficient: everything runs in the final
      # stage, so the resulting image's layers are the whole cache.
      cache: true
      cache-scope: logos-db
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-db' || format('{0}/logos/logos-db', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-db' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-workernode-vllm:
    name: Build Logos Worker Node (vLLM)
    needs: check-workernode-build
    if: ${{ needs.check-workernode-build.outputs.build == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos') }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: ./logos-workernode
      file: Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      # min mode (the default) stays here: everything runs in the final
      # stage, and this is by far the largest image — max mode would
      # export every intermediate CUDA/vLLM layer and could consume the
      # 10 GB per-repo GHA cache budget on its own, LRU-evicting the
      # other caches.
      cache: true
      cache-scope: logos-workernode-vllm
      sign: false
      # GIT_SHA is the commit the image is built from. On a pull request that is
      # the PR head: github.sha would be the temporary merge commit, which no
      # one can look up. The image itself is the PR merged into main as of the
      # build, so there the version names the PR's commit, not the exact tree.
      build-args: |
        BASE_IMAGE=ubuntu:24.04
        GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-workernode-vllm' || format('{0}/logos/logos-workernode-vllm', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-workernode-vllm' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  # ── Apple Silicon / MLX worker node ────────────────────────────────────────
  # Pushed to ghcr.io, NOT Harbor, and deliberately so: this image is pulled by
  # Mac workers during bootstrap, and requiring Harbor credentials on every Mac
  # just to fetch a tarball of Python source is friction we do not need. A
  # public GHCR package makes `bootstrap-macos.sh` work with no login at all.
  #
  # NOTE: a GHCR package is private on its first push. After the initial run,
  # flip it once under Package settings → Change visibility → Public.
  #
  # The image is a distribution artifact, never a running container — Metal
  # cannot be passed into one. See Dockerfile.mlx for the full reasoning.
  build-workernode-mlx:
    name: Build Logos Worker Node (MLX / Apple Silicon)
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Publish target for the MLX distribution image, in the same GHCR
          # namespace as every other Logos image. Written literally because it
          # must stay identical to the default IMAGE ref in
          # logos-workernode/scripts/bootstrap-macos.sh — that script is
          # the consumer, and nothing in CI catches a publish/consumer
          # mismatch.
          images: ghcr.io/logososs/logos-workernode-mlx
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      # linux/arm64 to match the Macs that consume it. The payload is pure
      # Python and shell, so this only spares Docker Desktop from emulating a
      # foreign image while copying files out of it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./logos-workernode
          file: ./logos-workernode/Dockerfile.mlx
          platforms: linux/arm64
          push: ${{ github.actor != 'dependabot[bot]' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The commit shown as this worker's version; see the vLLM worker job.
          build-args: |
            GIT_SHA=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-node-manager:
    name: Build Logos Node Manager
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: ./logos-node-manager
      file: Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-node-manager' || format('{0}/logos/logos-node-manager', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-node-manager' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-agent:
    name: Build Logos Agent Runner
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      # Built from the repository root: the Dockerfile copies paths under
      # logos-agent, matching how the orchestrator image is built.
      context: .
      file: logos-agent/Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-agent' || format('{0}/logos/logos-agent', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-agent' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-agent-gateway:
    name: Build Logos Agent Gateway
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      # Built from the repository root like the other agent images: the
      # `file` path is resolved relative to the context, so a context of the
      # gateway's own directory would look for the Dockerfile inside itself.
      context: .
      file: agent-gateway/Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-agent-gateway' || format('{0}/logos/logos-agent-gateway', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-agent-gateway' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-rate-gateway:
    name: Build Logos Rate Gateway
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      # Same root context as the agent gateway: the nginx configuration and
      # entrypoint are COPYed from rate-limit-gateway/ (and must be
      # whitelisted in .dockerignore for that to work).
      context: .
      file: rate-limit-gateway/Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-rate-gateway' || format('{0}/logos/logos-rate-gateway', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-rate-gateway' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  build-agent-workspace:
    name: Build Logos Agent Workspace
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'LogosOSS/Logos' }}
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: ${{ github.actor != 'dependabot[bot]' }}
      context: .
      file: logos-agent/workspace/Dockerfile
      platforms: linux/amd64
      runner: ubuntu-latest
      sign: false
      meta-images: |
        ${{ github.actor == 'dependabot[bot]' && 'ghcr.io/logososs/logos-agent-workspace' || format('{0}/logos/logos-agent-workspace', vars.LOGOS_HARBOR_REGISTRY) }}
        ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'ghcr.io/logososs/logos-agent-workspace' || '' }}
      meta-tags: |
        type=ref,event=pr
        type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
        type=semver,pattern={{version}}
      meta-flavor: |
        latest=false
    secrets:
      registry-auths: |
        - registry: ${{ github.actor == 'dependabot[bot]' && 'ghcr.io' || vars.LOGOS_HARBOR_REGISTRY }}
          username: ${{ github.actor == 'dependabot[bot]' && github.actor || vars.LOGOS_HARBOR_USER }}
          password: ${{ github.actor == 'dependabot[bot]' && secrets.GITHUB_TOKEN || secrets.LOGOS_HARBOR_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
