name: Logos - Build image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: true
        type: string
      file:
        required: true
        type: string
      push:
        required: true
        type: boolean
      build-args:
        type: string
        default: ""
      cache:
        type: boolean
        default: false
      cache-scope:
        type: string
        default: buildkit
      cache-mode:
        type: string
        default: min

permissions:
  contents: read
  packages: write

jobs:
  build:
    # Keep the check name used by successful-worker discovery stable.
    name: build (0, linux/amd64, ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/logososs/${{ inputs.image }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
          flavor: latest=false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # Path context and an explicit empty token keep package-write
          # credentials out of Dockerfile secret mounts and the source tree.
          github-token: ""
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.build-args }}
          provenance: mode=max
          cache-from: ${{ inputs.cache && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
          cache-to: ${{ inputs.cache && format('type=gha,scope={0},mode={1}', inputs.cache-scope, inputs.cache-mode) || '' }}
