name: Logos - Inspect Dev baseline 112
on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        default: preflight
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Inspect saved benchmark and active worker
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          command_timeout: 5m
          script: |
            set -eu
            docker exec logos-orchestrator python -c 'import base64; exec(base64.b64decode(""))'
