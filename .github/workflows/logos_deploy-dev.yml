name: Logos - Activate Dev baseline 112
on:
  workflow_dispatch:
    inputs:
      image-tag:
        type: string
        default: activate112
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: Dev
    steps:
      - name: Activate benchmark 112 and verify restart persistence
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VM_HOST }}
          username: ${{ vars.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          proxy_host: ${{ vars.DEPLOYMENT_GATEWAY_HOST }}
          proxy_username: ${{ vars.DEPLOYMENT_GATEWAY_USER }}
          proxy_key: ${{ secrets.DEPLOYMENT_GATEWAY_SSH_KEY }}
          proxy_port: ${{ vars.DEPLOYMENT_GATEWAY_PORT }}
          command_timeout: 12m
          script: |
            set -eu
            umask 077
            mkdir -p /opt/logos/ops-baseline112
            LOG_FILE="/opt/logos/ops-baseline112/activation-$(date -u +%Y%m%dT%H%M%SZ).jsonl"
            if docker exec logos-orchestrator python -c 'import base64; exec(base64.b64decode(""))' > "$LOG_FILE"; then
              cat "$LOG_FILE"
            else
              cat "$LOG_FILE"
              exit 1
            fi
