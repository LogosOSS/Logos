name: Logos - Review platform versions

on:
  schedule:
    - cron: "35 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare platform pins with upstream releases and package indexes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report_platform_versions.py | tee -a "$GITHUB_STEP_SUMMARY"
