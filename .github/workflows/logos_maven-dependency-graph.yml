name: Logos - Submit Maven dependencies

on:
  push:
    branches: [main]
    paths:
      - logos-webservice/pom.xml
      - .github/workflows/logos_maven-dependency-graph.yml

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          java-version: "25.0.5.1+2"
          distribution: temurin
      - uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
        with:
          directory: logos-webservice
          ignore-maven-wrapper: true
