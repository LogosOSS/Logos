name: Logos - Cleanup PR builds from GHCR

on:
  pull_request_target:
    types: [closed]

# Cancel a still-running PR build before deleting its images. Use the build
# workflow's group, not the default-branch ref of pull_request_target.
concurrency:
  group: Logos - Build-refs/pull/${{ github.event.pull_request.number }}/merge
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  cleanup:
    name: Delete PR builds from GHCR
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # This privileged workflow must never check out or execute the PR head.
      - name: Checkout trusted cleanup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Delete versions exclusive to the closed PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { cleanup } = require('./.github/scripts/cleanup-ghcr.cjs');
            await cleanup({ github, context, core });
