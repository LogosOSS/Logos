---
name: Logos - E2E

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_e2e.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "**"
      - ".github/workflows/logos_e2e.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow builds and executes pull-request code (docker build, pytest,
# Playwright). No job here writes to the repository, so the token is narrowed to
# read and the checkouts do not leave credentials on disk for that code to find.
permissions:
  contents: read

# The runners may carry a newer system Python, which uv would pick over the
# setup-python interpreter; the orchestrator must stay on 3.13 (tiktoken
# has no wheels for newer versions and would need a Rust toolchain to build).
env:
  UV_PYTHON: "3.13"

jobs:
  # Tier 1: the real worker driven against simulated GPUs. No Docker, no
  # network — this is the fast gate, and it is where the GPU-compatibility
  # regressions land.
  gpu-sim:
    name: GPU simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e .
          uv pip install --python .venv/bin/python -r ../logos-workernode/requirements.txt
        working-directory: e2e

      - name: Run Tier 1
        run: .venv/bin/python -m pytest tests/gpu -v --timeout=120
        working-directory: e2e

      - name: Upload simulator artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-sim-failure
          path: |
            /tmp/logos-vllm-logs/
          if-no-files-found: ignore
          retention-days: 7

  # Tiers 2 and 3: the compose stack — real orchestrator, real database, real
  # worker nodes on simulated hardware.
  stack:
    name: Stack (inter-node + client)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e .
        working-directory: e2e

      - name: Start the stack
        run: .venv/bin/python -m harness.stack.compose up
        working-directory: e2e

      - name: Run Tier 2 (inter-node)
        run: .venv/bin/python -m pytest tests/node -v --timeout=180
        working-directory: e2e

      - name: Run Tier 3 (client)
        run: .venv/bin/python -m pytest tests/client -v --timeout=180
        working-directory: e2e

      # A red E2E has to be diagnosable without reproducing it locally, so the
      # whole stack's logs are collected — not just the failing test's output.
      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-logs
          for service in logos-db migrate seed logos-orchestrator node-l40s node-2080ti; do
            .venv/bin/python -m harness.stack.compose logs "$service" > "/tmp/e2e-logs/$service.log" 2>&1 || true
          done
        working-directory: e2e

      - name: Upload stack logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-logs
          path: /tmp/e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: .venv/bin/python -m harness.stack.compose down
        working-directory: e2e

  # The browser tier. Separate from `stack` because it needs Keycloak, the
  # webservice and an Angular production build on top — roughly triple the
  # startup cost, for assertions the SDK tier cannot make.
  browser:
    name: Browser (Playwright)
    # Keep browser system dependencies on a fixed runner release.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: logos-ui/.nvmrc
          cache: "npm"
          cache-dependency-path: logos-ui/package-lock.json

      - name: Install stack dependencies
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e .
        working-directory: e2e

      - name: Install UI dependencies
        run: npm ci
        working-directory: logos-ui

      - name: Install and verify Playwright browser
        # Hosted runners provide Chromium's system libraries. Launch the pinned
        # browser to validate them before starting the Docker stack.
        run: |
          npx playwright install chromium
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          await browser.close();
          JS
        working-directory: logos-ui

      - name: Start the stack with the UI profile
        run: .venv/bin/python -m harness.stack.compose up --ui
        working-directory: e2e

      - name: Run Playwright
        run: npm run e2e
        working-directory: logos-ui

      - name: Collect stack logs
        if: always()
        run: |
          mkdir -p /tmp/e2e-ui-logs
          for service in logos-orchestrator logos-webservice keycloak logos-ui traefik node-l40s; do
            .venv/bin/python -m harness.stack.compose logs "$service" > "/tmp/e2e-ui-logs/$service.log" 2>&1 || true
          done
        working-directory: e2e

      # Traces, screenshots and videos are what make a browser failure
      # diagnosable at all — a bare assertion message rarely is.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            logos-ui/e2e/.playwright/report/
            logos-ui/e2e/.playwright/results/
            /tmp/e2e-ui-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: .venv/bin/python -m harness.stack.compose down
        working-directory: e2e
