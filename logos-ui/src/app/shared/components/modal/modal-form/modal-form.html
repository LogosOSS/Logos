<tumaet-ui-dialog
  [visible]="visible"
  (visibleChange)="visibleChange.emit($event)"
  [header]="title"
  [size]="tumUiSize"
  [closable]="dismissible"
  [closeOnEscape]="dismissible"
>
  <ng-content />
  <ng-template #footer>
    <ng-content select="[modal-footer]" />
  </ng-template>
</tumaet-ui-dialog>
