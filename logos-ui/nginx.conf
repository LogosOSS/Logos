# Keep the original path across internal redirects, without logging query credentials.
map $request_uri $access_log_path {
    default $request_uri;
    ~^(?<request_path_without_query>[^?]*)[?] $request_path_without_query;
}

map $http_referer $access_log_referer {
    default $http_referer;
    ~^(?<referer_without_query>[^?]*)[?] $referer_without_query;
}

log_format combined_without_query '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $access_log_path $server_protocol" '
                                  '$status $body_bytes_sent "$access_log_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log combined_without_query;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths serve index.html so Angular router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references content-hashed bundle filenames that change on every
    # build. A cached copy of it points at chunks that no longer exist, and the
    # SPA fallback above then silently serves index.html (200 text/html) for
    # those requests instead of a 404; the browser's module-script MIME check
    # rejects that and the app is left blank. Force revalidation so a rebuilt
    # image is always picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The claude-logos wrappers are downloaded by the install command the AI Tools
    # page hands out, so a cached copy is a stale wrapper on a developer's machine
    # for as long as the cache lives. Always revalidate, and serve them as text so
    # a curious user can open the URL and read the script instead of downloading it.
    location ~ ^/claude-logos\.(sh|ps1)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        default_type text/plain;
        charset utf-8;
    }
}
