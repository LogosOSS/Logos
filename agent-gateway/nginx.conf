# The only surface session containers may reach.
#
# Sessions run on their own *internal* network with permission prompts
# disabled, so they must not be able to browse the orchestrator's internal
# and admin endpoints, and certainly not the rest of the internal network
# (database, Keycloak, worker APIs). This gateway sits on both the session
# network and the internal network and forwards nothing but the orchestrator's
# /v1 model surface — the OpenAI/Anthropic-compatible API a session talks to
# for its model calls. Everything else is refused.
#
# The gateway obtains a new 60-second token through an internal auth
# subrequest for every model call. Neither it nor the session needs a static
# model key. Only this trusted gateway holds the existing internal secret;
# no token response header is forwarded to session containers.
# Keep the original path across internal redirects, without logging query credentials.
map $request_uri $access_log_path {
    default $request_uri;
    ~^(?<request_path_without_query>[^?]*)[?] $request_path_without_query;
}

map $http_referer $access_log_referer {
    default $http_referer;
    ~^(?<referer_without_query>[^?]*)[?] $referer_without_query;
}

log_format combined_without_query '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $access_log_path $server_protocol" '
                                  '$status $body_bytes_sent "$access_log_referer" "$http_user_agent"';

server {
    listen 80;
    access_log /var/log/nginx/access.log combined_without_query;

    # Proxy the whole /v1 prefix with the original request path intact
    # (proxy_pass without a URI passes the request through unchanged).
    location /v1/ {
        auth_request /_agent_credential;
        auth_request_set $agent_token $upstream_http_x_logos_agent_token;
        proxy_pass http://logos-orchestrator:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "Bearer $agent_token";
        # Alternative key headers take precedence in Logos authentication.
        # A session must not override the local-only managed identity.
        proxy_set_header logos_key "";
        proxy_set_header logos-key "";
        proxy_set_header x-api-key "";
        # Which session sent the request, by its address on the session
        # network. A paused session is frozen and never closes its
        # connections, so the runner asks the orchestrator to end every
        # request carrying this tag (logos-agent app/upstream.py). Set here,
        # replacing anything the session sent.
        proxy_set_header X-Logos-Client-Tag "agent:$remote_addr";
        # Model answers stream for minutes; buffering would stall the agent.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /_agent_credential {
        internal;
        proxy_pass http://logos-orchestrator:8080/internal/agent_credentials;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "Bearer ${LOGOS_INTERNAL_SECRET}";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Liveness probe for the container healthcheck: proves nginx is up and
    # listening. Only reachable from the internal/agent networks — sessions
    # call /v1, and nothing outside the stack can reach this gateway.
    location = /healthz {
        return 200;
    }

    location / {
        return 404;
    }
}
